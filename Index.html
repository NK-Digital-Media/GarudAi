    <script>
        const KEY = "AIzaSyAc2mlvV5BtK0uL6Jg1896qF5Y4BdAARMw";

        function speak(txt) {
            window.speechSynthesis.cancel(); 
            const ut = new SpeechSynthesisUtterance(txt);
            ut.lang = 'hi-IN';
            window.speechSynthesis.speak(ut);
        }

        async function startGaruda() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Chrome use karein."); return; }

            const rec = new SpeechRecognition();
            rec.lang = 'hi-IN';
            
            rec.onstart = () => { 
                document.getElementById('orb').innerText = "LISTENING";
                document.getElementById('msg').innerText = "> Listening to Neeraj...";
            };

            rec.onresult = async (e) => {
                const userMsg = e.results[0][0].transcript;
                document.getElementById('msg').innerText = "> Neeraj: " + userMsg;
                
                const orb = document.getElementById('orb');
                orb.innerText = "THINKING";
                orb.classList.add('thinking');

                try {
                    // FIX: Model name changed to gemini-pro for better stability
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: "Tumhara naam Garuda AI hai. Tum Neeraj ke assistant ho. Iska hindi mein ek chhota reply do: " + userMsg }] }] 
                        })
                    });

                    const d = await r.json();
                    
                    // Agar model flash na mile, toh ye auto-fix karega
                    const reply = d.candidates[0].content.parts[0].text;
                    
                    document.getElementById('msg').innerText = "> Garuda: " + reply;
                    orb.innerText = "SPEAKING";
                    orb.classList.remove('thinking');
                    speak(reply);

                    setTimeout(() => { orb.innerText = "ACTIVE"; }, 5000);

                } catch (err) {
                    // Ek aur try dusre model ke saath agar pehla fail ho
                    document.getElementById('msg').innerText = "> Trying alternative brain...";
                    retryWithModel(userMsg);
                }
            };
            rec.start();
        }

        async function retryWithModel(userMsg) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Short hindi reply: " + userMsg }] }] })
                });
                const d = await r.json();
                const reply = d.candidates[0].content.parts[0].text;
                document.getElementById('msg').innerText = "> Garuda: " + reply;
                speak(reply);
                document.getElementById('orb').innerText = "ACTIVE";
            } catch(e) {
                document.getElementById('msg').innerText = "> System Error. Please refresh.";
            }
        }
    </script>
